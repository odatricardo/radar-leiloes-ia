name: Radar Leiloes Automatico

on:
  schedule:
    # 11h00 e 20h00 UTC (08h00 e 17h00 BRT)
    - cron: "0 11 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      max_lotes:
        description: "Máximo de lotes avaliados pela IA nesta execução"
        required: false
        default: "15"

concurrency:
  group: radar-leiloes-coleta
  cancel-in-progress: true

jobs:
  coletar-e-auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright

      - name: Instalar Chromium do Playwright
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Executar scraper e pipeline de avaliação
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_FAST: ${{ secrets.GEMINI_MODEL_FAST }}
          GEMINI_MODEL_AUDIT: ${{ secrets.GEMINI_MODEL_AUDIT }}
          GEMINI_FALLBACK_MODELS: ${{ secrets.GEMINI_FALLBACK_MODELS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          PERMITIR_FALLBACK_REGRAS: "true"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SCRAPER_TARGET_URLS: ${{ secrets.SCRAPER_TARGET_URLS }}
          MAX_LOTES_POR_EXECUCAO: ${{ github.event.inputs.max_lotes || '15' }}
        run: |
          python scraper_playwright.py --max-lotes "$MAX_LOTES_POR_EXECUCAO" --delay 1.5
